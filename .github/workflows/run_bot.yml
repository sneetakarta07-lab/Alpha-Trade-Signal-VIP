name: VIP Signal Bot Auto Runner

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  post-signals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Libraries
        run: pip install -r requirements.txt

      - name: Run Bot
        run: python signal_bot.py
